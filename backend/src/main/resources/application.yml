spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: cafeos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cafeos}
    username: ${SPRING_DATASOURCE_USERNAME:cafeos}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-for-local-development}
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:user}
      password: ${SPRING_SECURITY_USER_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    root: INFO
    com.cafeos: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${SERVER_PORT:8080}
